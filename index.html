<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#F3F6F4"><meta name="description" content="Cardápio da semana com receitas do dia a dia e lista de compras automática."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" type="image/png" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Cardápio"><meta name="apple-mobile-web-app-status-bar-style" content="default"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style><title>Cardápio da Semana</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Conceito: geladeira organizada. Fundo claro, cartões brancos bem arredondados, verde-folha de destaque,
   comida como ilustração grande. Quatro telas: Semana, Receitas, Compras, Ajustes. */
:root{
  --bg:#F3F6F4; --surface:#FFFFFF; --surface-2:#EEF3F0; --ink:#141815; --ink-2:#5F6B64; --ink-3:#97A29B; --line:#E3E9E5;
  --accent:#27AE60; --accent-ink:#FFFFFF; --accent-soft:#E2F4E9; --mint:#D9F0E2; --dark:#17201B; --dark-ink:#FFFFFF;
  --heart:#EE4B59; --warn:#C9821A; --shadow:0 10px 30px rgba(24,48,34,.08);
  --head:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1411; --surface:#171E1A; --surface-2:#1F2823; --ink:#EEF3EF; --ink-2:#A4B0A8; --ink-3:#6E7A72; --line:#28332D;
    --accent:#3CC876; --accent-ink:#06150C; --accent-soft:#183324; --mint:#173A27; --dark:#EEF3EF; --dark-ink:#0F1411;
    --heart:#FF6B77; --warn:#F0B35A; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1411; --surface:#171E1A; --surface-2:#1F2823; --ink:#EEF3EF; --ink-2:#A4B0A8; --ink-3:#6E7A72; --line:#28332D;
  --accent:#3CC876; --accent-ink:#06150C; --accent-soft:#183324; --mint:#173A27; --dark:#EEF3EF; --dark-ink:#0F1411;
  --heart:#FF6B77; --warn:#F0B35A; --shadow:0 10px 30px rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--head);margin:0;letter-spacing:-.01em;text-wrap:balance}
.wrap{max-width:760px;margin:0 auto}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 10px}
.brand{border:0;background:none;padding:0;font:700 19px/1 var(--head);letter-spacing:-.02em}
.brand span{color:var(--accent)}
.ibtn{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.ibtn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

main{padding-bottom:calc(150px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px;padding-top:4px}
.h1{font:800 30px/1.1 var(--head);letter-spacing:-.02em}
.h1 small{display:block;font:600 13px/1.4 var(--body);color:var(--ink-2);letter-spacing:0;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.note{font-size:12.5px;color:var(--ink-3)}
.sec{display:flex;flex-direction:column;gap:10px;min-width:0}
.sec-t{font:700 17px/1.2 var(--head)}

/* semana */
.weeknav{display:flex;align-items:center;gap:4px;background:var(--surface);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.weeknav button{width:36px;height:36px;border-radius:50%;border:0;background:transparent;font-size:20px;line-height:1;color:var(--ink-2)}
.weeknav b{font:700 13px var(--head);min-width:94px;text-align:center;white-space:nowrap}
.banner{position:relative;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:var(--mint);border-radius:26px;padding:20px 18px 20px 22px;overflow:hidden}
.banner::before{content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
  background:repeating-radial-gradient(circle at 85% 20%,transparent 0 14px,rgba(39,174,96,.18) 14px 15px)}
.banner>*{position:relative}
.banner h2{font:700 21px/1.2 var(--head)}
.banner p{margin:6px 0 14px;font-size:13px;color:var(--ink-2)}
.banner .big{font-size:76px;line-height:1;filter:drop-shadow(0 10px 14px rgba(0,0,0,.18))}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:16px;border:0;background:var(--surface);color:var(--ink);font:700 14px var(--head);box-shadow:var(--shadow)}
.btn.dark{background:var(--dark);color:var(--dark-ink);box-shadow:none}
.btn.green{background:var(--accent);color:var(--accent-ink);box-shadow:0 8px 20px rgba(39,174,96,.28)}
.btn.soft{background:var(--accent-soft);color:var(--accent);box-shadow:none}
.btn.line{background:transparent;border:1.5px solid var(--line);box-shadow:none}
.btn.danger{color:var(--heart)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.day{background:var(--surface);border-radius:24px;padding:14px 14px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px}
.day.past{opacity:.7}
.day.today{outline:2px solid var(--accent)}
.day-h{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:0 4px 4px}
.day-h b{font:700 16px var(--head)}
.day-h span{font-size:13px;color:var(--ink-3)}
.pill{font:700 11px var(--head);background:var(--accent);color:var(--accent-ink);padding:3px 9px;border-radius:999px}
.meal{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:start;padding:8px 4px;border-top:1px solid var(--line)}
.meal>span{font:600 12px/32px var(--head);color:var(--ink-2)}
.meal>.ml{display:flex;flex-direction:column;align-items:flex-start}
.trc{border:0;background:none;padding:0 0 4px;font:700 11.5px/1.2 var(--head);color:var(--accent);min-height:24px;text-align:left}
.slot{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.dish .pc{font:700 11px var(--head);color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 6px;margin-left:2px}
.dish{display:inline-flex;align-items:center;gap:6px;max-width:100%;min-height:32px;padding:0 4px 0 10px;border-radius:12px;background:var(--surface-2);border:0;font-size:13.5px;font-weight:600;text-align:left}
.dish .e{font-size:16px}
.dish .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dish .x{width:28px;height:28px;border-radius:8px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink-3);font-size:17px;flex:none;padding:0}
.dish .dn{display:inline-flex;align-items:center;gap:6px;min-width:0;border:0;background:none;padding:0;font:inherit;color:inherit;text-align:left}
.dish.tag{background:transparent;border:1.5px dashed var(--line);color:var(--ink-2)}
.add{width:32px;height:32px;border-radius:12px;border:1.5px dashed var(--line);background:transparent;color:var(--accent);font-size:20px;line-height:1;display:grid;place-items:center}
.add.wide{width:auto;padding:0 12px;font:700 13px var(--head);gap:4px;display:inline-flex;align-items:center}
.dbtn{margin-left:auto;border:0;background:var(--accent-soft);color:var(--accent);font:700 12px var(--head);border-radius:999px;padding:6px 12px;min-height:32px}
.day-h .pill{margin-left:0}
.dcard{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.dcard.novo{outline:2px solid var(--accent)}
.dcard-h{display:flex;align-items:center;gap:8px}
.dcard-h b{font:700 15px var(--head)}
.tagp{font:700 11px var(--head);color:var(--ink-3);background:var(--surface-2);padding:3px 8px;border-radius:999px}
.dcard.novo .tagp{background:var(--accent-soft);color:var(--accent)}
.dline{display:grid;grid-template-columns:40px 1fr;gap:10px;align-items:center;width:100%;border:0;background:transparent;padding:4px 0;text-align:left}
.dline .e{width:40px;height:40px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;font-size:22px}
.dline b{display:block;font:700 14px/1.25 var(--head)}
.dline small{display:block;font-size:12px;color:var(--ink-3)}
.undo{border:0;background:transparent;color:var(--accent);font:800 14px var(--head);margin-left:8px;padding:4px 0;text-decoration:underline}

/* receitas */
.search{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:0 16px;box-shadow:var(--shadow)}
.search svg{width:19px;height:19px;flex:none;fill:none;stroke:var(--ink-3);stroke-width:2;stroke-linecap:round}
.search input{flex:1;min-width:0;border:0;background:transparent;padding:14px 0;font-size:16px;outline:none}
.cats{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.cat{flex:0 0 96px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 6px 12px;border-radius:22px;border:1.5px solid var(--line);background:var(--surface);text-align:center}
.cat .e{font-size:34px;line-height:1.1}
.cat b{font:700 12.5px/1.2 var(--head)}
.cat small{font:700 11px var(--head);color:var(--accent)}
.cat[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:600 13px var(--head);color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--dark);border-color:transparent;color:var(--dark-ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rc{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 12px 14px;border-radius:24px;background:var(--surface);border:0;box-shadow:var(--shadow);text-align:center;min-width:0}
.rc .plate{width:84px;height:84px;border-radius:50%;background:var(--accent-soft);display:grid;place-items:center;font-size:46px;margin-bottom:4px}
.rc b{font:700 14px/1.25 var(--head);overflow-wrap:anywhere}
.rc small{font-size:12px;color:var(--ink-3)}
.heart{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:0;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-3)}
.heart svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2.2}
.heart.on{color:var(--heart)}
.heart.on svg{fill:currentColor}
.empty{padding:28px 18px;text-align:center;color:var(--ink-2);background:var(--surface);border:1.5px dashed var(--line);border-radius:22px}
.empty b{display:block;color:var(--ink);margin-bottom:4px;font:700 16px var(--head)}

/* compras */
.ctop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:2px 2px 10px;font-size:14px;color:var(--ink-2)}
.ctop b{font:700 18px var(--head);color:var(--ink)}
.ctools{display:flex;gap:6px}
.ctools button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font:700 12.5px var(--head);color:var(--ink-2)}
.ctools button.danger{color:#c2410c}
.fixmm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:14px 22px;background:var(--accent);color:var(--accent-ink);font:700 14.5px var(--head);box-shadow:0 10px 26px rgba(0,0,0,.18);white-space:nowrap}
.fixmm svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}
.menu-s{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
.menu-s button{border:0;background:none;text-align:left;padding:13px 16px;font:700 14.5px var(--head);color:var(--ink);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.menu-s button:first-child{border-top:0}
.menu-s button small{font:500 12.5px var(--body,inherit);color:var(--ink-3)}
.menu-s button.danger{color:#c2410c}
.passados{border:1px dashed var(--line);background:none;border-radius:16px;padding:12px;font:700 13.5px var(--head);color:var(--ink-3)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-radius:22px;box-shadow:var(--shadow)}
.sum div{padding:14px;border-left:1px solid var(--line);min-width:0}
.sum div:first-child{border-left:0}
.sum b{display:block;font:800 24px/1 var(--head)}
.sum span{font-size:11.5px;color:var(--ink-3);font-weight:700}
.group{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.group-h{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;font:700 14px var(--head)}
.group-h .e{font-size:20px}
.group-h small{margin-left:auto;font:600 12px var(--body);color:var(--ink-3)}
.item{display:grid;grid-template-columns:28px 1fr;gap:12px;align-items:center;width:100%;padding:10px 16px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.item .ck{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-size:15px;font-weight:800}
.item.ok .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.ok .t{text-decoration:line-through;color:var(--ink-3)}
.item .t{display:block;font-weight:600;overflow-wrap:anywhere}
.item .t b{font-family:var(--head);font-weight:700;margin-right:4px}
.item small{display:block;font-size:12px;color:var(--ink-3);overflow-wrap:anywhere}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0;border:0;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);padding:13px 16px;font-size:16px}

/* ajustes */
.card{background:var(--surface);border-radius:22px;box-shadow:var(--shadow);padding:6px 0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.set:first-child{border-top:0}
.set span small{display:block;font-size:12px;color:var(--ink-3)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:38px;height:38px;border-radius:12px;border:0;background:var(--surface-2);font-size:20px;font-weight:700}
.step b{font:800 20px var(--head);min-width:26px;text-align:center}
.tog{position:relative;width:50px;height:30px;border-radius:999px;border:0;background:var(--line);flex:none}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.tog[aria-checked="true"]{background:var(--accent)}
.tog[aria-checked="true"]::after{transform:translateX(20px)}

/* navegação */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;color:var(--ink-3);font:600 11px var(--head);min-height:52px;border-radius:14px}
.tab svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--accent)}

/* folhas */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(10,20,14,.45)}
.panel{position:relative;width:100%;max-width:620px;max-height:94%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:30px 30px 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.panel>*{flex-shrink:0}
.grab{width:42px;height:4px;border-radius:2px;background:var(--line);margin:0 auto}
.sh{display:flex;align-items:center;gap:10px}
.sh h2{font:700 18px/1.2 var(--head);flex:1;text-align:center}
.sh .ibtn{background:var(--surface);box-shadow:var(--shadow);width:40px;height:40px}
.hero{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:6px 0 0}
.bigplate{position:relative;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--surface) 0 56%,var(--accent-soft) 57%);display:grid;place-items:center;font-size:104px;line-height:1;margin-bottom:8px;box-shadow:var(--shadow)}
.bigplate i{position:absolute;font-style:normal;font-size:24px;width:42px;height:42px;border-radius:50%;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.hero h3{font:800 26px/1.15 var(--head);max-width:22ch}
.facts{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px;font-size:13px;color:var(--ink-2)}
.facts b{color:var(--accent);font-family:var(--head)}
.ing{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.ing div{display:grid;grid-template-columns:96px 1fr;gap:10px;padding:10px 16px;border-top:1px solid var(--line);font-size:14.5px}
.ing div:first-child{border-top:0}
.ing div b{font:700 13.5px var(--head);color:var(--accent)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
ol.steps li::before{content:counter(s);width:30px;height:30px;border-radius:10px;background:var(--accent-soft);color:var(--accent);font:800 14px/30px var(--head);text-align:center}
.foot{position:sticky;bottom:0;display:flex;gap:10px;align-items:center;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 calc(14px + env(safe-area-inset-bottom,0px))}
.foot .btn.green{flex:1;min-height:56px;border-radius:20px;font-size:16px}
.foot .heart{position:static;width:56px;height:56px;background:var(--surface);box-shadow:var(--shadow)}
.foot .heart svg{width:22px;height:22px}
.pick{display:flex;flex-direction:column;gap:12px;background:var(--surface);border-radius:22px;padding:16px;box-shadow:var(--shadow)}
.plist{display:flex;flex-direction:column;background:var(--surface);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.prow{display:grid;grid-template-columns:44px 1fr 32px;gap:12px;align-items:center;width:100%;padding:9px 14px;border:0;border-top:1px solid var(--line);background:transparent;text-align:left}
.prow:first-child{border-top:0}
.prow .e{width:44px;height:44px;border-radius:14px;background:var(--accent-soft);display:grid;place-items:center;font-size:24px}
.prow b{display:block;font:700 14px/1.25 var(--head)}
.prow small{display:block;font-size:12px;color:var(--ink-3)}
.prow .ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:800}
.prow.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.dlista{margin-top:6px;border:1.5px dashed var(--accent);background:none;color:var(--accent);border-radius:14px;padding:11px 12px;font:700 13.5px var(--head);text-align:left;display:flex;justify-content:space-between;gap:8px;align-items:center}

function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;
  for(i=1;i<=a.length;i++){var c=[i],mn=i;for(j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<mn)mn=c[j];}if(mn>max)return max+1;p=c;}return p[b.length];}
function hit(w,list,fz){var best=0;
  for(var i=0;i<list.length;i++){var t=list[i];

    if(fz&&w.length>=5&&t.length>=4&&t[0]===w[0]){var m=w.length>=8?2:1;if(lev(w,t,m)<=m)best=Math.max(best,.6);}}

    alts.forEach(function(w){if(!w)return;b=Math.max(b,hit(w,r.tn,1)*10,hit(w,r.tm,0)*6,hit(w,r.ti,1)*3);});
    if(!b)return 0;tot+=b;}

function buscar(q,lista){var ws=toks(q).filter(function(w){return w.length>=2;});if(!ws.length)return {r:lista.slice(),parecido:false};

function usadosCom(wk,over){var u=usadosSemana(wk);if(over)Object.keys(over).forEach(function(d){Object.keys(over[d]).forEach(function(m){(over[d][m].r||[]).forEach(function(id){u[id]=(u[id]||0)+1;});});});return u;}
function sortear(lista,peso){var tot=0,ws=lista.map(function(r){var w=Math.max(0,peso(r));tot+=w;return w;});if(!lista.length)return null;if(tot<=0)return lista[Math.floor(Math.random()*lista.length)];
  var x=Math.random()*tot;for(var i=0;i<lista.length;i++){x-=ws[i];if(x<=0)return lista[i];}return lista[lista.length-1];}
function sugerirRefeicao(wk,d,m,over,evitarId){
  var fds=d>=5,usados=usadosCom(wk,over),antes=usadosSemana(addD(wk,-7)),pool;
  /* sobras automáticas: jantar de ontem que rende marmita vira almoço de hoje */

  var lim=S.rapidoSemana&&!fds;
  if(m==="cafe")pool=porCat(["cafe"],function(x){return fds||x.tempo<=20;});
  else if(m==="lanche")pool=porCat(["lanche","cafe"],function(x){return fds||x.tempo<=30;});
  else if(m==="almoco")pool=porCat(Math.random()<.22?["massa"]:["prato"],function(x){return fds||(!x.tags.includes("fds")&&(!lim||x.tempo<=60));});
  else pool=porCat(Math.random()<.3?["sopa","lanche","massa"]:["prato"],function(x){return fds||(!x.tags.includes("fds")&&(!lim||x.tempo<=45));});
  if(!pool.length)return null;
  /* proteínas próximas: mesmo dia e dia anterior */
  var viz={};if(S.variar&&(m==="almoco"||m==="jantar")){[[d,"almoco"],[d,"jantar"],[d-1,"almoco"],[d-1,"jantar"],[d+1,"almoco"],[d+1,"jantar"]].forEach(function(p){if(p[0]<0||p[0]>6||(p[0]===d&&p[1]===m))return;var r=principal(ver(wk,p[0],p[1],over));if(r&&r.prot!=="veg"&&r.prot!=="outro")viz[r.prot]=(viz[r.prot]||0)+1;});}
  var r=sortear(pool,function(x){
    if(x.id===evitarId)return 0;
    var w=1;if(usados[x.id])w*=.02;if(antes[x.id])w*=.3;if(S.fav.indexOf(x.id)>=0)w*=3;
    if(viz[x.prot])w*=Math.pow(.12,viz[x.prot]);return w;});
  if(!r)return null;

    if(S.arrozFeijao&&r.tags.includes("arroz")&&ARROZ)out.r.push(ARROZ.id);

/* sugere um dia: só os espaços vazios, ou o dia todo se refazer=true */
function sugerirDia(wk,d,refazer,over){
  var res={},n=0,tmp=over||{};

    var v=sugerirRefeicao(wk,d,m,tmp,refazer&&antigo?antigo.id:null);if(!v)return;
    tmp[d][m]=v;res[m]=v;n++;});

function frac(q){var i=Math.floor(q),f=Math.round((q-i)*4)/4;if(f===1){i++;f=0;}var fs=f===.25?"¼":f===.5?"½":f===.75?"¾":"";return (i?String(i):"")+(fs?(i?" ":"")+fs:"")||"0";}

function listaCompras(wk){
  var p=plano(wk),itens={},ordem=[];
  if(!p)return [];
  var seq=[];for(var d=0;d<7;d++)MEALS.forEach(function(mm){if(S.refeicoes[mm[0]])seq.push([d,mm[0]]);});

  seq.forEach(function(dm){
    var s=p[dm[0]]&&p[dm[0]][dm[1]];if(!s||!s.r)return;var mult=1+(extra[dm[0]+"|"+dm[1]]||0);
    if(!dias[dm[0]]&&mult===1)return; if(!dias[dm[0]])mult-=1;
    s.r.forEach(function(id){var r=BY[id];if(!r)return;var f=fator(r,porcDe(s,id))*mult;
      r.ing.forEach(function(g){
        var fam=g.u==="kg"?"g":g.u==="l"?"ml":g.u,q=g.u==="kg"||g.u==="l"?g.q*1000:g.q;
        var key=norm(g.n)+"|"+(g.u==="ag"?"ag":fam);
        var keyQ=norm(g.n)+"|"+fam;
        if(g.u==="ag"){var qk=Object.keys(itens).filter(function(k){return k.split("|")[0]===norm(g.n)&&itens[k].u!=="ag";})[0];if(qk){add(itens[qk],r);return;}}
        else{var ak=norm(g.n)+"|ag";if(itens[ak]){itens[keyQ]=itens[ak];delete itens[ak];itens[keyQ].u=fam;itens[keyQ].q=0;itens[keyQ].key=keyQ;}}
        if(!itens[key]){itens[key]={key:key,n:g.n,u:g.u==="ag"?"ag":fam,q:0,s:g.s,src:[]};ordem.push(key);}
        itens[key].q+=q*f;add(itens[key],r);
      });});
  });
  function add(it,r){if(it.src.indexOf(r.nome)<0)it.src.push(r.nome);}

  Object.keys(itens).forEach(function(k){var it=itens[k],nk=norm(it.n);

      var cl=comp(wk);cl.diasAntes=cl.dias;cl.extrasAntes=cl.extras;cl.dias={};cl.rm={};cl.extras=[];cl.ok={};ui.confirm="";save();render();toast("Lista de compras limpa");break;

    case "extra":var inp=$("#extra"),t=inp&&inp.value.trim();if(t){comp(wk).extras.push({t:t.slice(0,80),ok:false});save();render();setTimeout(function(){var i2=$("#extra");if(i2)i2.focus();},30);}break;
    case "pornocardapio":var r=BY[ui.sheet.id],td=(parse(hoje()).getDay()+6)%7;
      ui.sheet.add=true;ui.sheet.d=ui.wk===curWk()?td:0;
      var guess=r.cat==="cafe"?"cafe":r.cat==="lanche"?"lanche":"jantar";if(!S.refeicoes[guess])guess=mealsOn()[0][0];ui.sheet.m=guess;
      drawSheet();setTimeout(function(){var pk=$("#pick");if(pk)pk.scrollIntoView({block:"center",behavior:"smooth"});},30);break;
    case "confirmar":var sh=ui.sheet,rc=BY[sh.id];addReceita(wk,sh.d,sh.m,sh.id);var sx=slot(wk,sh.d,sh.m,true);sx.p=sx.p||{};if((sh.porc||S.pessoas)!==S.pessoas)sx.p[sh.id]=sh.porc;else delete sx.p[sh.id];save();
      if(S.arrozFeijao&&(sh.m==="almoco"||sh.m==="jantar")&&rc.tags.indexOf("arroz")>=0&&ARROZ&&rc.id!==ARROZ.id)addReceita(wk,sh.d,sh.m,ARROZ.id);
      if(S.arrozFeijao&&(sh.m==="almoco"||sh.m==="jantar")&&rc.tags.indexOf("feijao")>=0&&FEIJAO)addReceita(wk,sh.d,sh.m,FEIJAO.id);
      toast("No "+MEALN[sh.m].toLowerCase()+" de "+DIAS[sh.d].toLowerCase());closeSheet();break;
    case "backup":baixar();break;
    case "novidades":verNovidades();break;
    case "restaurar":$("#arq").click();break;
    case "apagar":if(ui.confirm!=="apagar"){pedirConfirma("apagar");break;}try{localStorage.removeItem(KEY);}catch(x){}location.reload();break;
  }
});
document.addEventListener("input",function(e){
  if(e.target.id==="q"){ui.q=e.target.value;drawRres();}
  else if(e.target.id==="pq"&&ui.sheet){ui.sheet.q=e.target.value;var sh=ui.sheet,s=slot(ui.wk,sh.d,sh.m,false);
    $("#plist").innerHTML=plistHTML(pickLista(sh),s);}
});
document.addEventListener("change",function(e){if(e.target.id==="arq"&&e.target.files[0])restaurar(e.target.files[0]);});
document.addEventListener("keydown",function(e){
  if(e.key==="Escape"&&ui.sheet){closeSheet();return;}
  if(e.key==="Enter"&&e.target.id==="extra"){e.preventDefault();var b=document.querySelector('[data-act="extra"]');if(b)b.click();return;}
  if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("rc")&&e.target===document.activeElement){e.preventDefault();openSheet({type:"receita",id:e.target.getAttribute("data-open"),porc:S.pessoas});}
});
window.addEventListener("hashchange",function(){go(location.hash.slice(1));});
load();
if(!S.listaPorDia){Object.keys(S.planos).forEach(function(wk){var c=comp(wk);for(var d=0;d<7;d++)c.dias[d]=true;});S.listaPorDia=true;save();}
ui.wk=curWk();
ui.tab=["semana","receitas","compras","ajustes"].indexOf(location.hash.slice(1))>=0?location.hash.slice(1):"semana";
draw();
(function(){
  if((S.versaoVista||0)>=VERSAO)return;
  var usava=Object.keys(S.planos).length||S.fav.length||Object.keys(S.compras).length;
  if(!usava){S.versaoVista=VERSAO;save();return;}
  setTimeout(verNovidades,500);
})();
})();
</script>
